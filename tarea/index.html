<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi lista de tareas</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 15px; }
        section { border: 1px solid #ccc; padding: 20px; border-radius: 10px; }
        input, button { padding: 10px; margin: 5px 0; }
        .error { color: #c0392b; }
        .tarea { display: flex; justify-content: space-between; gap: 10px; padding: 8px; border-bottom: 1px solid #ddd; }
        .completada { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>
    <h1>Mi lista de tareas</h1>
    <p>Organiza tus actividades pendientes.</p>
    <section>
        <form id="formTarea">
            <input id="textoTarea" type="text" placeholder="Escribe una tarea">
            <button type="submit">Agregar tarea</button>
        </form>
        <p id="mensaje"></p>
        <p>Tareas registradas: <span id="cantidad">0</span></p>
        <ul id="listaTareas"></ul>
    </section>
    <script src="app.js"></script>
</body>
</html>
